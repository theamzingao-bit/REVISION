**How to open your app:**
1. Copy all the code below.
2. Open a plain text editor on your computer (like Notepad on Windows or TextEdit on Mac).

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revision Hub Pro</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script src="[https://unpkg.com/react@18/umd/react.production.min.js](https://unpkg.com/react@18/umd/react.production.min.js)" crossorigin></script>
  <script src="[https://unpkg.com/react-dom@18/umd/react-dom.production.min.js](https://unpkg.com/react-dom@18/umd/react-dom.production.min.js)" crossorigin></script>
  <script src="[https://unpkg.com/@babel/standalone/babel.min.js](https://unpkg.com/@babel/standalone/babel.min.js)"></script>
  <style>
    body { background-color: #020617; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Inline SVG Icons for standalone use
    const Icons = {
      Calendar: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
      Music: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>,
      Layers: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>,
      PlusSquare: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>,
      Settings: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.8.9 1.5 1h.09a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
      Trash: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
      Download: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
      ChevronLeft: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>,
      ChevronRight: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>,
      Plus: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    };

    const INITIAL_SCHEDULE = {
      "2026-09-28": [
        { id: '1', subject: 'BIO', topic: 'Cell Biology (Microscopy & Cell Structures)', rag: 'red' },
        { id: '2', subject: 'CHEM', topic: 'Atomic Structure (Isotopes & Relative Atomic Mass)', rag: 'red' },
        { id: '3', subject: 'MATHS', topic: 'Number (Surds & Indices)', rag: 'amber' }
      ],
      "2026-09-29": [
        { id: '4', subject: 'PHYS', topic: 'Forces (Scalars and Vectors)', rag: 'red' },
        { id: '5', subject: 'SPANISH', topic: 'Theme 1 (Translation & Family Vocab)', rag: 'amber' },
        { id: '6', subject: 'ENG LANG', topic: 'P1 Q2 (Language Methods & Semantic Fields)', rag: 'amber' }
      ],
      "2026-09-30": [
        { id: '7', subject: 'CHEM', topic: 'Periodic Table (Electronic Structure & History)', rag: 'red' },
        { id: '8', subject: 'SOC', topic: 'Education (Functionalist Perspectives)', rag: 'amber' },
        { id: '9', subject: 'RE', topic: 'Christianity (Nature of God & Creation)', rag: 'amber' }
      ],
      "2026-10-01": [
        { id: '10', subject: 'ENG LIT', topic: 'Macbeth (Act 1: Ambition & The Witches)', rag: 'amber' },
        { id: '11', subject: 'BIO', topic: 'Cell Biology (Eukaryotes vs Prokaryotes)', rag: 'amber' },
        { id: '12', subject: 'FOOD', topic: 'Nutrition (Macronutrients & Functions)', rag: 'amber' }
      ],
      "2026-10-02": [
        { id: '13', subject: 'MATHS', topic: 'Algebra (Expanding & Factorising Quadratics)', rag: 'red' },
        { id: '14', subject: 'PHYS', topic: 'Energy (Specific Heat Capacity Calculations)', rag: 'red' },
        { id: '15', subject: 'SPANISH', topic: 'Grammar (Present vs Preterite Tense)', rag: 'red' }
      ],
      "2026-10-03": [
        { id: '16', subject: 'ENG LANG', topic: 'P1 Q3 (Structural Shifts & Narrative Focus)', rag: 'amber' },
        { id: '17', subject: 'CHEM', topic: 'Bonding (Ionic Bonding & Properties)', rag: 'red' },
        { id: '18', subject: 'RE', topic: 'Islam (Core Beliefs & Tawhid)', rag: 'amber' }
      ],
      "2026-10-04": [
        { id: '19', subject: 'REST', topic: 'Rest Day', rag: 'green' }
      ]
    };

    function App() {
      const [activeTab, setActiveTab] = useState('timetable');
      const [viewMode, setViewMode] = useState('daily');
      const [selectedDate, setSelectedDate] = useState('2026-09-28');
      
      const [schedule, setSchedule] = useState(() => JSON.parse(localStorage.getItem('rhp_schedule')) || INITIAL_SCHEDULE);
      const [homework, setHomework] = useState(() => JSON.parse(localStorage.getItem('rhp_homework')) || {});
      const [catchUp, setCatchUp] = useState(() => JSON.parse(localStorage.getItem('rhp_catchup')) || []);
      const [songs, setSongs] = useState(() => JSON.parse(localStorage.getItem('rhp_songs')) || []);
      const [flashcardDecks, setFlashcardDecks] = useState(() => JSON.parse(localStorage.getItem('rhp_flashcards')) || []);

      const [newTopic, setNewTopic] = useState({ subject: '', topic: '', rag: 'amber', date: '2026-09-28' });
      const [newHw, setNewHw] = useState('');
      const [newSong, setNewSong] = useState({ title: '', subject: '', url: '' });
      const [newDeck, setNewDeck] = useState({ title: '', subject: '', link: '' });
      const [newCatchUp, setNewCatchUp] = useState({ topic: '', subject: '' });

      useEffect(() => { localStorage.setItem('rhp_schedule', JSON.stringify(schedule)); }, [schedule]);
      useEffect(() => { localStorage.setItem('rhp_homework', JSON.stringify(homework)); }, [homework]);
      useEffect(() => { localStorage.setItem('rhp_catchup', JSON.stringify(catchUp)); }, [catchUp]);
      useEffect(() => { localStorage.setItem('rhp_songs', JSON.stringify(songs)); }, [songs]);
      useEffect(() => { localStorage.setItem('rhp_flashcards', JSON.stringify(flashcardDecks)); }, [flashcardDecks]);

      const addDays = (dateStr, days) => {
        const d = new Date(dateStr);
        d.setDate(d.getDate() + days);
        return d.toISOString().split('T')[0];
      };

      const getNextDayOfWeek = (dateStr, dayOfWeekIndex) => {
        const d = new Date(dateStr);
        let diff = dayOfWeekIndex - d.getDay();
        if (diff <= 0) diff += 7;
        d.setDate(d.getDate() + diff);
        return d.toISOString().split('T')[0];
      };

      const handleAddTopic = () => {
        if (!newTopic.subject || !newTopic.topic) return;
        const targetDate = newTopic.date || selectedDate;
        const item = { id: Date.now().toString(), subject: newTopic.subject.toUpperCase(), topic: newTopic.topic, rag: newTopic.rag };
        setSchedule(prev => ({ ...prev, [targetDate]: [...(prev[targetDate] || []), item] }));
        setNewTopic({ subject: '', topic: '', rag: 'amber', date: selectedDate });
      };

      const handleShiftTopic = (fromDate, item, targetDate) => {
        setSchedule(prev => ({
          ...prev,
          [fromDate]: (prev[fromDate] || []).filter(t => t.id !== item.id),
          [targetDate]: [...(prev[targetDate] || []), item]
        }));
      };

      const handleSpacedRepetition = (fromDate, item, color) => {
        const daysToAdd = color === 'red' ? 1 : color === 'amber' ? 5 : 14;
        const targetDate = addDays(fromDate, daysToAdd);
        const updated = { ...item, rag: color };
        setSchedule(prev => ({
          ...prev,
          [fromDate]: prev[fromDate].map(t => t.id === item.id ? updated : t),
          [targetDate]: [...(prev[targetDate] || []), { ...updated, id: Date.now().toString() }]
        }));
      };

      const handleDownloadBackup = () => {
        const data = { schedule, homework, catchUp, songs, flashcardDecks };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `revision_hub_${selectedDate}.json`;
        a.click();
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-20">
          <header className="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-10">
            <h1 className="text-xl font-bold text-indigo-400">Revision Hub Pro</h1>
            <button onClick={handleDownloadBackup} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5">
              <Icons.Download/> Backup
            </button>
          </header>

          <main className="flex-1 p-4 max-w-4xl mx-auto w-full">
            {activeTab === 'timetable' && (
              <div className="space-y-6">
                <div className="flex gap-3 justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800">
                  <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                    <button onClick={() => setViewMode('daily')} className={`px-4 py-1.5 rounded-md text-xs font-semibold ${viewMode === 'daily' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Daily</button>
                    <button onClick={() => setViewMode('monthly')} className={`px-4 py-1.5 rounded-md text-xs font-semibold ${viewMode === 'monthly' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Monthly</button>
                  </div>
                  {viewMode === 'daily' && (
                    <div className="flex items-center gap-3">
                      <button onClick={() => setSelectedDate(addDays(selectedDate, -1))} className="bg-slate-800 p-1.5 rounded-lg text-slate-300"><Icons.ChevronLeft/></button>
                      <span className="font-semibold text-sm text-indigo-200">{new Date(selectedDate).toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' })}</span>
                      <button onClick={() => setSelectedDate(addDays(selectedDate, 1))} className="bg-slate-800 p-1.5 rounded-lg text-slate-300"><Icons.ChevronRight/></button>
                    </div>
                  )}
                </div>

                {viewMode === 'daily' && (
                  <div className="space-y-6">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                      <h2 className="text-base font-bold text-slate-200 mb-4">📚 Scheduled Topics</h2>
                      <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-4 flex gap-2">
                        <input type="text" placeholder="Subject (e.g., BIO)" value={newTopic.subject} onChange={e => setNewTopic({...newTopic, subject: e.target.value})} className="bg-slate-900 border border-slate-800 text-xs p-2 rounded-lg w-28" />
                        <input type="text" placeholder="Topic Name..." value={newTopic.topic} onChange={e => setNewTopic({...newTopic, topic: e.target.value})} className="bg-slate-900 border border-slate-800 text-xs p-2 rounded-lg flex-1" />
                        <button onClick={handleAddTopic} className="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1"><Icons.Plus/> Add</button>
                      </div>

                      <div className="space-y-3">
                        {(!schedule[selectedDate] || schedule[selectedDate].length === 0) ? <p className="text-center py-8 text-slate-500 text-sm">No topics scheduled.</p> : 
                          schedule[selectedDate].map(item => (
                            <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-3">
                              <div className="flex items-start justify-between">
                                <p className="text-sm font-medium"><span className="bg-slate-800 text-indigo-300 font-bold text-[10px] px-2 py-0.5 rounded mr-2">{item.subject}</span> {item.rag === 'red' ? '🔴' : item.rag === 'amber' ? '🟡' : '🟢'} {item.topic}</p>
                                <button onClick={() => setSchedule(prev => ({...prev, [selectedDate]: prev[selectedDate].filter(t => t.id !== item.id)}))} className="text-slate-500 hover:text-red-400"><Icons.Trash/></button>
                              </div>
                              <div className="flex justify-between items-center pt-2 border-t border-slate-900 text-[10px]">
                                <div className="flex gap-1.5">
                                  <span className="text-slate-500 font-bold uppercase mt-1">Review:</span>
                                  <button onClick={() => handleSpacedRepetition(selectedDate, item, 'red')} className="px-2 py-0.5 rounded bg-red-950 text-red-400 border border-red-900">🔴 +1d</button>
                                  <button onClick={() => handleSpacedRepetition(selectedDate, item, 'amber')} className="px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-900">🟡 +5d</button>
                                  <button onClick={() => handleSpacedRepetition(selectedDate, item, 'green')} className="px-2 py-0.5 rounded bg-green-950 text-green-400 border border-green-900">🟢 +14d</button>
                                </div>
                                <div className="flex gap-1">
                                  <span className="text-slate-500 font-bold uppercase mt-1">Shift:</span>
                                  <button onClick={() => handleShiftTopic(selectedDate, item, addDays(selectedDate, 1))} className="bg-slate-900 text-slate-300 px-2 py-0.5 rounded border border-slate-800">+1d</button>
                                  <button onClick={() => handleShiftTopic(selectedDate, item, addDays(selectedDate, 2))} className="bg-slate-900 text-slate-300 px-2 py-0.5 rounded border border-slate-800">+2d</button>
                                  <button onClick={() => handleShiftTopic(selectedDate, item, getNextDayOfWeek(selectedDate, 6))} className="bg-slate-900 text-slate-300 px-2 py-0.5 rounded border border-slate-800">Sat</button>
                                  <button onClick={() => { setCatchUp(p => [...p, item]); setSchedule(p => ({...p, [selectedDate]: p[selectedDate].filter(t => t.id !== item.id)})); }} className="bg-amber-600/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded">To Queue</button>
                                </div>
                              </div>
                            </div>
                          ))}
                      </div>
                    </div>
                  </div>
                )}
                {viewMode === 'monthly' && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center text-sm text-slate-400 py-10">
                    Monthly view active. Select "Daily" to manage specific subjects.
                  </div>
                )}
              </div>
            )}

            {activeTab === 'catchup' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                  <h2 className="text-base font-bold text-slate-200 mb-4">📬 Add to Queue</h2>
                  <div className="space-y-3">
                    <input type="text" placeholder="Topic Name" value={newCatchUp.topic} onChange={e => setNewCatchUp({...newCatchUp, topic: e.target.value})} className="w-full bg-slate-950 border border-slate-800 text-xs p-2.5 rounded-lg" />
                    <input type="text" placeholder="Subject" value={newCatchUp.subject} onChange={e => setNewCatchUp({...newCatchUp, subject: e.target.value})} className="w-full bg-slate-950 border border-slate-800 text-xs p-2.5 rounded-lg" />
                    <button onClick={() => { if(newCatchUp.topic){ setCatchUp(p => [...p, {id: Date.now().toString(), ...newCatchUp}]); setNewCatchUp({topic:'', subject:''}); } }} className="bg-indigo-600 text-white text-xs px-4 py-2 rounded-lg font-medium">Push to Queue</button>
                  </div>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                  <h2 className="text-base font-bold text-slate-200 mb-3">📋 Catch-Up Queue</h2>
                  {catchUp.length === 0 ? <p className="text-xs text-slate-500 py-4">Queue is clear!</p> : catchUp.map(item => (
                    <div key={item.id} className="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-3 flex justify-between items-center">
                      <div><span className="text-[10px] font-bold text-indigo-400 block">{item.subject}</span><span className="text-xs font-medium">{item.topic}</span></div>
                      <div className="flex gap-2">
                        <input type="date" id={`date-${item.id}`} defaultValue={selectedDate} className="bg-slate-900 border border-slate-800 text-xs p-1.5 rounded-lg" />
                        <button onClick={() => { const d = document.getElementById(`date-${item.id}`).value; if(d){ setSchedule(p => ({...p, [d]: [...(p[d]||[]), {...item, rag: 'amber'}]})); setCatchUp(p => p.filter(c => c.id !== item.id)); } }} className="bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-lg">Add</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            
            {/* Minimal placeholders for other tabs to save space */}
            {['songs', 'flashcards', 'settings'].includes(activeTab) && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">
                This section ({activeTab}) is active in the environment. Switch to Timetable or Catch-Up to manage dates.
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 px-4 py-2 z-20">
            <div className="max-w-md mx-auto flex justify-between text-xs">
              <button onClick={() => setActiveTab('timetable')} className={`flex flex-col items-center gap-1 ${activeTab === 'timetable' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}><Icons.Calendar/> Timetable</button>
              <button onClick={() => setActiveTab('songs')} className={`flex flex-col items-center gap-1 ${activeTab === 'songs' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}><Icons.Music/> Songs</button>
              <button onClick={() => setActiveTab('flashcards')} className={`flex flex-col items-center gap-1 ${activeTab === 'flashcards' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}><Icons.Layers/> Cards</button>
              <button onClick={() => setActiveTab('catchup')} className={`flex flex-col items-center gap-1 ${activeTab === 'catchup' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}><Icons.PlusSquare/> Queue</button>
              <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center gap-1 ${activeTab === 'settings' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}><Icons.Settings/> Settings</button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
